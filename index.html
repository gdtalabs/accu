<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b4a82" />
  <title>ACCU Integrated Clinic System — MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="mobile-header">
    <button id="menuBtn" class="icon-btn" aria-label="Open navigation">☰</button>
    <div class="mobile-brand">
      <img src="accu-logo.jpeg" alt="ACCU logo" />
      <div>
        <strong>ACCU</strong>
        <span id="mobileRoleLabel">Administrator</span>
      </div>
    </div>
    <button id="mobileQuickBtn" class="mobile-quick" aria-label="Quick action">＋</button>
  </header>

  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <img src="accu-logo.jpeg" alt="ACCU logo" />
        <div>
          <strong>ACCU</strong>
          <span>Integrated Clinic System</span>
        </div>
      </div>

      <div class="role-chip">
        <span>Signed in as</span>
        <strong id="desktopRoleLabel">Administrator</strong>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button class="nav-item" data-view="patients"><span class="nav-icon">👤</span><span>Patients</span></button>
        <button class="nav-item" data-view="consultations"><span class="nav-icon">🩺</span><span>Consultations</span></button>
        <button class="nav-item" data-view="laboratory"><span class="nav-icon">🧪</span><span>Laboratory</span></button>
        <button class="nav-item" data-view="pharmacy"><span class="nav-icon">💊</span><span>Pharmacy</span></button>
        <button class="nav-item" data-view="pos"><span class="nav-icon">▣</span><span>POS / Billing</span></button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span><span>Reports</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span>Admin</span></button>
      </nav>

      <div class="sidebar-footer">
        <label for="roleSelect">Demo signed-in role</label>
        <select id="roleSelect">
          <option>Administrator</option>
          <option>Receptionist</option>
          <option>Physician</option>
          <option>Medical Technologist</option>
          <option>Pharmacist</option>
          <option>Cashier</option>
        </select>
        <p class="role-help">Switch roles to test each workspace. Production access must also be enforced on the server/database.</p>
        <button id="resetDemo" class="ghost danger">Reset demo data</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">ACCU Laboratory and Diagnostic Center</p>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="roleContext" class="role-context"></p>
        </div>
        <div class="top-actions">
          <span id="todayLabel" class="muted"></span>
          <button id="quickSaleBtn" class="primary">+ New Transaction</button>
        </div>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="patients" class="view"></section>
      <section id="consultations" class="view"></section>
      <section id="laboratory" class="view"></section>
      <section id="pharmacy" class="view"></section>
      <section id="pos" class="view"></section>
      <section id="reports" class="view"></section>
      <section id="settings" class="view"></section>
    </main>
  </div>

  <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Mobile navigation"></nav>

  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
