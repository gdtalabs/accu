<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACCU Clinic MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="accu-logo.jpeg" alt="ACCU logo" />
        <div>
          <strong>ACCU</strong>
          <span>Clinic Management MVP</span>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="patients">Patients</button>
        <button class="nav-item" data-view="consultations">Consultations</button>
        <button class="nav-item" data-view="laboratory">Laboratory</button>
        <button class="nav-item" data-view="pharmacy">Pharmacy</button>
        <button class="nav-item" data-view="pos">POS / Billing</button>
        <button class="nav-item" data-view="reports">Reports</button>
        <button class="nav-item" data-view="settings">Admin</button>
      </nav>

      <div class="sidebar-footer">
        <label for="roleSelect">Active role</label>
        <select id="roleSelect">
          <option>Administrator</option>
          <option>Receptionist</option>
          <option>Physician</option>
          <option>Medical Technologist</option>
          <option>Pharmacist</option>
          <option>Cashier</option>
        </select>
        <button id="resetDemo" class="ghost danger">Reset demo data</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">ACCU Laboratory and Diagnostic Center</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="top-actions">
          <span id="todayLabel" class="muted"></span>
          <button id="quickSaleBtn" class="primary">+ New Transaction</button>
        </div>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="patients" class="view"></section>
      <section id="consultations" class="view"></section>
      <section id="laboratory" class="view"></section>
      <section id="pharmacy" class="view"></section>
      <section id="pos" class="view"></section>
      <section id="reports" class="view"></section>
      <section id="settings" class="view"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="app.js"></script>
</body>
</html>
